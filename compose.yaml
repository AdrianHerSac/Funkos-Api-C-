services:
  funkosapi:
    image: funkosapi
    build:
      context: .
      dockerfile: FunkosAPI/Dockerfile
    ports:
      - "5084:8080" 
    depends_on:
      - mongodb
    environment:
      - ConnectionStrings__MongoDb=mongodb://mongodb:27017

  mongodb:
    image: mongo:latest
    container_name: mongo_funkos
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: